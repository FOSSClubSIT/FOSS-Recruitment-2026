name: Academic Task & Announcement Aggregator

on:
  schedule:
    # Off-peak fallback crons to avoid top-of-the-hour GitHub Actions congestion
    # 02:37 UTC = 08:07 AM IST (Morning Run)
    - cron: '37 2 * * *'
    # 14:37 UTC = 08:07 PM IST (Evening Run)
    - cron: '37 14 * * *'
  workflow_dispatch: # Allows manual 1-click execution from GitHub website
    inputs:
      force:
        description: 'Force re-notification of seen items'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [telegram_override, scheduled_run, morning_run, evening_run]

jobs:
  run-aggregator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Notifications Database Cache
        uses: actions/cache@v4
        with:
          path: data/notifications.db
          key: notifications-db-${{ github.run_id }}
          restore-keys: |
            notifications-db-

      - name: Run Academic Aggregator Agent
        env:
          MOODLE_BASE_URL: ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          MOODLE_TARGET_BATCH: ${{ secrets.MOODLE_TARGET_BATCH }}
          MOODLE_COURSE_IDS: ${{ secrets.MOODLE_COURSE_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URGENT_THRESHOLD_HOURS: ${{ secrets.URGENT_THRESHOLD_HOURS }}
        run: |
          mkdir -p data
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "⚡ Triggered with override/force. Processing all items..."
            python main.py --force
          else
            python main.py
          fi

      - name: Save Notifications Database Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/notifications.db
          key: notifications-db-${{ github.run_id }}
